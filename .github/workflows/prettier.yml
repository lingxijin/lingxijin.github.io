name: Prettier (check & auto-fix)

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Prettier 💾
        run: npm i -g prettier @shopify/prettier-plugin-liquid

      - name: Create .prettierignore (if missing)
        run: |
          if [ ! -f .prettierignore ]; then
            printf "%s\n" \
              "node_modules/" \
              "_site/" \
              "vendor/" \
              "assets/jupyter/" \
              "*.ipynb" \
              "# 如果以后恢复博客，再移除这行" \
              "_posts/" > .prettierignore
          fi

      - name: Prettier Check 🔎
        id: check
        run: npx prettier . --check

      - name: Auto-fix with Prettier ✨
        if: ${{ failure() }}
        run: npx prettier . --write

      - name: Commit fixes (if any) 📝
        if: ${{ failure() || github.event_name == 'push' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: format with Prettier"
