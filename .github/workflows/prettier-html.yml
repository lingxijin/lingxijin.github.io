name: Prettier (auto-fix main)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 关键：本地安装 Prettier + Liquid 插件（不用 -g）
      - name: Install Prettier + Liquid plugin
        run: npm i --no-save prettier @shopify/prettier-plugin-liquid

      - name: Create .prettierignore (if missing)
        run: |
          if [ ! -f .prettierignore ]; then
            printf "%s\n" \
              "node_modules/" \
              "_site/" \
              "vendor/" \
              "assets/jupyter/" \
              "*.ipynb" \
              "# 如果以后恢复博客，再移除这行" \
              "_posts/" > .prettierignore
          fi

      # 显式传入插件；用 . 根目录递归，避免 shell 对 ** 的兼容问题
      - name: Run Prettier (write)
        run: npx prettier . --write --plugin=@shopify/prettier-plugin-liquid --log-level=warn

      - name: Commit changes (if any)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: format with Prettier"
