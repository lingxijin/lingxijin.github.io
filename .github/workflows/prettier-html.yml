name: Prettier (auto-fix main)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Prettier
        run: npm i -g prettier

      - name: Create .prettierignore (if missing)
        run: |
          if [ ! -f .prettierignore ]; then
            printf "%s\n" \
              "node_modules/" \
              "_site/" \
              "vendor/" \
              "assets/jupyter/" \
              "*.ipynb" \
              "# 如果以后恢复博客，再移除这行" \
              "_posts/" > .prettierignore
          fi

      - name: Run Prettier (write)
        run: npx prettier "**/*.{md,markdown,mdx,html,css,js,json,yml,yaml}" --write

      - name: Commit changes (if any)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: format with Prettier"
